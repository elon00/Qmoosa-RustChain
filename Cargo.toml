[workspace]
resolver = "2"
members = [
    "crates/pqc",
    "crates/x402",
    "crates/conway",
    "crates/agent-core",
    "contracts/qdot-token",
    "contracts/launchpad",
    "contracts/x402-settlement",
    "services/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Solo Open-Source Developer"]
license = "Apache-2.0"
repository = "https://github.com/elon00/Qmoosa-RustChain"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
